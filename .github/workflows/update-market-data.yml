name: Update Market Data

on:
  schedule:
    # Run at 6:30 AM Hong Kong Time (10:30 PM UTC previous day)
    - cron: '30 22 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.PAT_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests beautifulsoup4 lxml
    
    - name: Fetch stock heatmap data (6 markets)
      run: |
        python fetch_stocks_multimarket.py
    
    - name: Fetch overnight indicators
      run: |
        python fetch_overnight_indicators.py
    
    - name: Fetch Polymarket trends
      run: |
        python fetch_polymarket_trends.py
    
    - name: Commit and push if changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Update market data - $(date +'%Y-%m-%d %H:%M:%S')"
        file_pattern: 'data/*.json'
        commit_user_name: github-actions[bot]
        commit_user_email: github-actions[bot]@users.noreply.github.com
        pull: '--rebase --autostash'
