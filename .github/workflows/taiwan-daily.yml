name: Taiwan Daily News Update

on:
  schedule:
    # Runs at 22:30 UTC = 06:30 HK/Taiwan time
    - cron: '30 22 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-taiwan-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install gspread google-auth-oauthlib anthropic playwright yfinance requests --break-system-packages
          playwright install chromium
      
      - name: Setup Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}' | base64 -d > token.pickle
      
      - name: Run Taiwan scraper
        run: python scrape_daily.py
      
      - name: Run Taiwan analyzer
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python analyze_news.py
      
      - name: Generate Taiwan website data
        run: python generate_data.py
      
      - name: Fetch stock data (Taiwan, Korea, India)
        run: python fetch_stocks_multimarket.py
      
      - name: Fetch overnight indicators
        run: python fetch_overnight_indicators.py
      
      - name: Fetch Polymarket trends
        run: python fetch_polymarket_trends.py
      
      - name: Commit and push Taiwan data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.json
          git pull origin main --rebase --autostash || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update Taiwan news data - $(date +'%Y-%m-%d')" &&
            git push
          )
