name: Market Museum Korea

on:
  schedule:
    - cron: '30 7 * * 1-5'  # Daily: Mon-Fri, KRX close (3:30pm KST = 06:30 UTC) + 1hr for FINI
    - cron: '0 7 * * 0'     # Weekly recap: Sunday
  workflow_dispatch:

jobs:
  run-korea:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai pillow python-telegram-bot yfinance requests

      - name: Run Korea Market Museum
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python market_museum_korea.py
