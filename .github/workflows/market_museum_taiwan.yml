name: Market Museum Taiwan

on:
  schedule:
    - cron: '30 5 * * 1-5'  # Daily: Mon-Fri, TWSE close (1:30pm TST = 05:30 UTC)
    - cron: '0 6 * * 0'     # Weekly recap: Sunday
  workflow_dispatch:

jobs:
  run-taiwan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai pillow python-telegram-bot yfinance requests

      - name: Run Taiwan Market Museum
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python market_museum_taiwan.py
