name: Indonesia Daily News

on:
  schedule:
    # Run at 21:00 UTC daily (5:00 AM Hong Kong time, HKT = UTC+8)
    - cron: '0 21 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  indonesia-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --break-system-packages requests beautifulsoup4 anthropic gspread google-auth-oauthlib google-auth playwright
          playwright install chromium
          playwright install-deps
      
      - name: Create credentials file
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}' | base64 -d > token.pickle
      
      - name: Scrape Indonesia news
        run: |
          python scrape_daily_indonesia.py
        continue-on-error: true
      
      - name: Analyze with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python analyze_news_indonesia.py
        continue-on-error: true
      
      - name: Generate data file
        run: |
          mkdir -p data
          python generate_data_indonesia.py
        continue-on-error: true
      
      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/indonesia-news.json
          git diff --staged --quiet || git commit -m "Update Indonesia news data - $(date +'%Y-%m-%d')"
          git push
        continue-on-error: true
      
      - name: Cleanup
        run: |
          rm -f credentials.json token.pickle
