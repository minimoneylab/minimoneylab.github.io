name: Brazil Daily News Update
on:
  schedule:
    # Runs at 10:30 UTC = 07:30 BRT (Brazil time UTC-3)
    - cron: '30 10 * * *'
  workflow_dispatch:  # Allow manual trigger
permissions:
  contents: write
jobs:
  update-brazil-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install gspread google-auth-oauthlib anthropic playwright --break-system-packages
          playwright install chromium
      
      - name: Setup Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}' | base64 -d > token.pickle
      
      - name: Run Brazil scraper
        run: python scrape_daily_brazil.py
      
      - name: Run Brazil analyzer
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python analyze_news_brazil.py
      
      - name: Generate Brazil website data
        run: python generate_data_brazil.py
      
      - name: Pull latest changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
      
      - name: Commit and push Brazil data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Brazil news data - $(date +'%Y-%m-%d')"
          file_pattern: 'data/*.json'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
