name: Korea Daily News Update

on:
  schedule:
    # Runs at 21:00 UTC = 6:00 AM Korea time (UTC+9)
    - cron: '0 21 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-korea-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --break-system-packages gspread google-auth-oauthlib anthropic playwright
          playwright install chromium
          playwright install-deps
      
      - name: Setup Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}' | base64 -d > token.pickle
      
      - name: Run Korea scraper (KEDGlobal + InfomaxAI)
        run: python scrape_daily_korea.py
      
      - name: Run Korea analyzer
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python analyze_news_korea.py
      
      - name: Generate Korea website data
        run: python generate_data_korea.py
      
      - name: Commit and push Korea data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/korea-news.json
          git pull origin main --rebase --autostash || true
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update Korea news data - $(date +'%Y-%m-%d')" &&
            git push
          )
      
      - name: Cleanup
        run: |
          rm -f credentials.json token.pickle
