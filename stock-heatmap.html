<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Heatmap - MiniMoneyLab</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #FAFAF5;
            color: #2B2B2B;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #2B2B2B;
        }
        
        .subtitle {
            color: #9B9B9B;
            font-size: 0.95rem;
        }
        
        /* Market Selector */
        .market-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 24px 0;
            flex-wrap: wrap;
        }
        
        .market-button {
            background: white;
            border: 2px solid #E5E5E5;
            border-radius: 8px;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        
        .market-button:hover {
            border-color: #2B2B2B;
            background: #f9f9f9;
        }
        
        .market-button.active {
            background: #2B2B2B;
            color: white;
            border-color: #2B2B2B;
        }
        
        .market-button.soon {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .market-button.soon:hover {
            border-color: #E5E5E5;
            background: white;
        }
        
        .market-flag {
            font-size: 1.2rem;
        }
        
        .soon-badge {
            background: #E5E5E5;
            color: #9B9B9B;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 4px;
        }
        
        .market-button.active .soon-badge {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .update-time {
            color: #9B9B9B;
            font-size: 0.85rem;
            margin-top: 8px;
            text-align: center;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: white;
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid #E5E5E5;
            text-align: center;
            min-width: 120px;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: #9B9B9B;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .stat-value.positive { color: #10b981; }
        .stat-value.negative { color: #ef4444; }
        
        #heatmap {
            background: white;
            border-radius: 12px;
            border: 1px solid #E5E5E5;
            padding: 20px;
            min-height: 450px;
            overflow-x: auto;  /* Allow horizontal scroll if needed */
            overflow-y: visible;  /* Don't cut off vertically */
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        
        #heatmap > div {
            max-width: 100% !important;
            width: 100% !important;
        }
        
        #heatmap .plotly {
            max-width: 100% !important;
            width: 100% !important;
        }
        
        /* Add text shadow to treemap text for better readability */
        #heatmap text {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            font-weight: bold !important;
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            #heatmap {
                min-height: 500px;  /* Taller on mobile */
                padding: 12px;
            }
            
            .stats {
                gap: 12px;
            }
            
            .stat-card {
                min-width: 90px;
                padding: 12px 16px;
            }
            
            .stat-value {
                font-size: 1.2rem;
            }
        }
        
        .legend {
            text-align: center;
            margin-top: 20px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            border: 1px solid #E5E5E5;
        }
        
        .legend-title {
            font-size: 0.85rem;
            color: #6B6B6B;
            margin-bottom: 8px;
        }
        
        .legend-scale {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        
        .legend-item {
            font-size: 0.8rem;
            color: #9B9B9B;
        }
        
        .loading {
            text-align: center;
            padding: 100px 20px;
            color: #9B9B9B;
        }
        
        .error {
            text-align: center;
            padding: 100px 20px;
            color: #ef4444;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #6B6B6B;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .back-link:hover {
            color: #2B2B2B;
        }
        
        /* Stock Table Styles */
        .stock-table-container {
            background: white;
            border-radius: 12px;
            border: 1px solid #E5E5E5;
            padding: 20px;
            overflow-x: auto;
        }
        
        .stock-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        .stock-table th {
            background: #FAFAF5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #2B2B2B;
            border-bottom: 2px solid #E5E5E5;
            white-space: nowrap;
        }
        
        .stock-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #F0F0F0;
        }
        
        .stock-table tr:last-child td {
            border-bottom: none;
        }
        
        .stock-table tr:hover {
            background: #FAFAF5;
        }
        
        .stock-table .positive {
            color: #10b981;
        }
        
        .stock-table .negative {
            color: #ef4444;
        }
        
        .stock-table .rank {
            color: #9B9B9B;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .stock-table {
                font-size: 0.8rem;
            }
            
            .stock-table th,
            .stock-table td {
                padding: 8px 6px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Daily Brief</a>
        
        <div class="header">
            <h1>📊 Stock Market Heatmap</h1>
            <p class="subtitle">Top stocks by market capitalization</p>
        </div>
        
        <!-- Market Selector -->
        <div class="market-selector">
            <button class="market-button active" onclick="switchMarket('twse')">
                <span class="market-flag">TW</span>
                <span>TWSE</span>
            </button>
            
            <button class="market-button" onclick="switchMarket('kospi')">
                <span class="market-flag">KR</span>
                <span>KOSPI</span>
            </button>
            
            <button class="market-button" onclick="switchMarket('nse')">
                <span class="market-flag">IN</span>
                <span>NSE</span>
            </button>
            
            <button class="market-button" onclick="switchMarket('hose')">
                <span class="market-flag">VN</span>
                <span>HOSE</span>
            </button>
            
            <button class="market-button" onclick="switchMarket('klse')">
                <span class="market-flag">MY</span>
                <span>KLSE</span>
            </button>
            
            <button class="market-button" onclick="switchMarket('idx')">
                <span class="market-flag">ID</span>
                <span>IDX</span>
            </button>
        </div>
        
        <p class="update-time" id="updateTime">Loading...</p>
        
        <div class="stats" id="stats">
            <!-- Stats will be populated by JavaScript -->
        </div>
        
        <!-- Index & Top Stocks Table -->
        <div id="stocksTable" style="display: none; margin-bottom: 24px;">
            <!-- Will be populated by JavaScript -->
        </div>
        
        <div style="text-align: center; margin-bottom: 12px;">
            <button id="resetZoom" onclick="resetHeatmapZoom()" style="
                background: white;
                border: 1px solid #E5E5E5;
                border-radius: 6px;
                padding: 8px 16px;
                cursor: pointer;
                font-size: 0.85rem;
                color: #6B6B6B;
            ">
                🔄 Reset View
            </button>
        </div>
        
        <div style="width: 100%; max-width: 100%; overflow: hidden;">
            <div id="heatmap" style="min-height: 450px;">
                <!-- Heatmap will be rendered here -->
            </div>
        </div>
        
        <div class="legend">
            <div class="legend-title">Color indicates daily performance</div>
            <div class="legend-scale">
                <span class="legend-item">🔴 Down</span>
                <span class="legend-item">⚪ Flat</span>
                <span class="legend-item">🟢 Up</span>
            </div>
            <div style="margin-top: 8px; font-size: 0.75rem; color: #9B9B9B;">
                Size represents market capitalization
            </div>
        </div>
    </div>

    <script>
        let currentMarket = 'twse';
        let currentData = null;
        
        function resetHeatmapZoom() {
            if (currentData) {
                renderHeatmap(currentData);
            }
        }
        
        function switchMarket(market) {
            currentMarket = market;
            
            // Update active button
            document.querySelectorAll('.market-button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.closest('.market-button').classList.add('active');
            
            // Load data for selected market
            loadHeatmapData(market);
        }
        
        async function loadHeatmapData(market = 'twse') {
            try {
                // Add timestamp to prevent caching
                const timestamp = new Date().getTime();
                const filename = `data/stocks-heatmap-${market}.json?t=${timestamp}`;
                
                const response = await fetch(filename);
                if (!response.ok) throw new Error('Failed to load data');
                
                const data = await response.json();
                currentData = data;  // Store for reset
                renderStats(data);
                renderStockTable(data, market);
                renderHeatmap(data);
                
            } catch (error) {
                console.error('Error loading heatmap:', error);
                document.getElementById('heatmap').innerHTML = 
                    '<div class="error">📭 Failed to load stock data<br><small>' + error.message + '</small></div>';
                document.getElementById('stocksTable').style.display = 'none';
            }
        }
        
        function renderStats(data) {
            const stocks = data.stocks;
            const gainers = stocks.filter(s => s.change_pct > 0);
            const losers = stocks.filter(s => s.change_pct < 0);
            const topGainer = gainers.length > 0 ? gainers.reduce((a, b) => a.change_pct > b.change_pct ? a : b) : null;
            const topLoser = losers.length > 0 ? losers.reduce((a, b) => a.change_pct < b.change_pct ? a : b) : null;
            
            document.getElementById('updateTime').textContent = 
                `Last updated: ${data.update_time}`;
            
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-label">Total Stocks</div>
                    <div class="stat-value">${stocks.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Gainers</div>
                    <div class="stat-value positive">${gainers.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Losers</div>
                    <div class="stat-value negative">${losers.length}</div>
                </div>
                ${topGainer ? `
                <div class="stat-card">
                    <div class="stat-label">Top Gainer</div>
                    <div class="stat-value positive">${topGainer.name}</div>
                    <div style="font-size: 0.85rem; color: #10b981; margin-top: 4px;">
                        ${topGainer.change_pct > 0 ? '+' : ''}${topGainer.change_pct}%
                    </div>
                </div>
                ` : ''}
                ${topLoser ? `
                <div class="stat-card">
                    <div class="stat-label">Top Loser</div>
                    <div class="stat-value negative">${topLoser.name}</div>
                    <div style="font-size: 0.85rem; color: #ef4444; margin-top: 4px;">
                        ${topLoser.change_pct > 0 ? '+' : ''}${topLoser.change_pct}%
                    </div>
                </div>
                ` : ''}
            `;
        }
        
        function renderStockTable(data, market) {
            const stocks = [...data.stocks].sort((a, b) => b.market_cap - a.market_cap);
            
            // Market index info
            const marketNames = {
                'twse': 'TWSE Index',
                'kospi': 'KOSPI Index',
                'nse': 'NIFTY 50',
                'hose': 'VN-Index',
                'klse': 'FTSE Bursa Malaysia KLCI',
                'idx': 'IDX Composite'
            };
            
            const marketName = marketNames[market] || 'Market Index';
            
            // Check if we have PE/PB data for this market
            const hasPE = stocks.some(s => s.pe_ratio !== null && s.pe_ratio !== undefined);
            const hasPB = stocks.some(s => s.pb_ratio !== null && s.pb_ratio !== undefined);
            
            // Debug logging
            console.log(`${market.toUpperCase()}: hasPE=${hasPE}, hasPB=${hasPB}`);
            console.log('First stock:', stocks[0]);
            
            let html = `
                <div class="stock-table-container">
                    <h3 style="margin: 0 0 16px 0; font-size: 1.1rem;">${marketName} - Top 20 Stocks by Market Cap</h3>
                    <div style="overflow-x: auto;">
                        <table class="stock-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Company</th>
                                    <th style="text-align: right;">Price</th>
                                    <th style="text-align: right;">Change</th>
                                    <th style="text-align: right;">Market Cap (B)</th>
            `;
            
            // Smart columns: Show PE/PB if available, otherwise Div Yield and 52W High
            if (hasPE && hasPB) {
                html += `
                                    <th style="text-align: right;">PE</th>
                                    <th style="text-align: right;">PB</th>
                `;
            } else {
                html += `
                                    <th style="text-align: right;">Div Yield</th>
                                    <th style="text-align: right;">From 52W High</th>
                `;
            }
            
            html += `
                                </tr>
                            </thead>
                            <tbody>
            `;
            
            stocks.slice(0, 20).forEach((stock, index) => {
                const changeClass = stock.change_pct > 0 ? 'positive' : stock.change_pct < 0 ? 'negative' : '';
                const changeSymbol = stock.change_pct > 0 ? '+' : '';
                const marketCapB = (stock.market_cap / 1000000000).toFixed(1);
                
                html += `
                    <tr>
                        <td class="rank">${index + 1}</td>
                        <td style="font-weight: 500;">${stock.name}</td>
                        <td style="text-align: right;">${stock.price.toFixed(2)}</td>
                        <td style="text-align: right;" class="${changeClass}">${changeSymbol}${stock.change_pct.toFixed(2)}%</td>
                        <td style="text-align: right;">$${marketCapB}</td>
                `;
                
                if (hasPE && hasPB) {
                    // Show PE and PB
                    const peDisplay = stock.pe_ratio ? stock.pe_ratio.toFixed(2) : 'N/A';
                    const pbDisplay = stock.pb_ratio ? stock.pb_ratio.toFixed(2) : 'N/A';
                    html += `
                        <td style="text-align: right;">${peDisplay}</td>
                        <td style="text-align: right;">${pbDisplay}</td>
                    `;
                } else {
                    // Show Div Yield and 52W High
                    const divYield = stock.dividend_yield ? stock.dividend_yield.toFixed(2) + '%' : 'N/A';
                    
                    let fromHighDisplay = 'N/A';
                    let fromHighClass = '';
                    if (stock.pct_from_high !== null && stock.pct_from_high !== undefined) {
                        fromHighDisplay = stock.pct_from_high.toFixed(1) + '%';
                        fromHighClass = stock.pct_from_high >= 0 ? 'positive' : 'negative';
                    }
                    
                    html += `
                        <td style="text-align: right;">${divYield}</td>
                        <td style="text-align: right;" class="${fromHighClass}">${fromHighDisplay}</td>
                    `;
                }
                
                html += `</tr>`;
            });
            
            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            document.getElementById('stocksTable').innerHTML = html;
            document.getElementById('stocksTable').style.display = 'block';
        }
        
        function renderHeatmap(data) {
            const stocks = data.stocks;
            
            // Prepare data for treemap
            const labels = stocks.map(s => s.name);  // Just name, no % (will show in hover)
            const parents = stocks.map(() => '');  // No sectors, flat structure
            const values = stocks.map(s => s.market_cap || 1000000000);  // Default 1B if missing
            const changes = stocks.map(s => s.change_pct);
            const texts = stocks.map(s => 
                `${s.change_pct > 0 ? '+' : ''}${s.change_pct}%`
            );
            
            // Convert market cap to billions for hover
            const marketCapBillions = values.map(v => v / 1000000000);
            
            // FINVIZ-STYLE COLORS - Exact match to Finviz palette
            const colors = changes.map(change => {
                // Strong gains
                if (change > 4) return 'rgb(0, 128, 0)';        // Dark forest green
                if (change > 2) return 'rgb(46, 125, 50)';      // Medium green
                if (change > 0.5) return 'rgb(102, 187, 106)';  // Light green
                
                // Neutral zone
                if (change > -0.5) return 'rgb(117, 117, 117)'; // Dark gray (not light!)
                
                // Losses
                if (change > -2) return 'rgb(239, 83, 80)';     // Coral red (not pink!)
                if (change > -4) return 'rgb(211, 47, 47)';     // Deep red
                return 'rgb(183, 28, 28)';                      // Dark crimson
            });
            
            const trace = {
                type: 'treemap',
                labels: labels,
                parents: parents,
                values: values,
                text: texts,
                textposition: 'middle center',
                marker: {
                    colors: colors,
                    line: { width: 2, color: 'white' }
                },
                customdata: marketCapBillions,  // Pass billions for hover
                hovertemplate: '<b>%{label}</b><br>Change: %{text}<br>Market Cap: $%{customdata:.1f}B<extra></extra>',
                hoverlabel: {
                    bgcolor: 'rgba(0, 0, 0, 0.9)',  // Dark background for hover
                    bordercolor: 'white',
                    font: {
                        family: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
                        size: 14,
                        color: 'white'  // White text for contrast
                    }
                },
                textfont: {
                    size: 16,
                    color: 'white',
                    family: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif, Arial, sans-serif',
                    weight: 700  // Bold text like Finviz
                }
            };
            
            // Get actual container width
            const container = document.getElementById('heatmap');
            const containerWidth = container.offsetWidth;
            
            // Better mobile detection and responsive sizing
            const isMobile = window.innerWidth <= 768;
            
            // Mobile: Make it scrollable vertically (taller)
            // Desktop: Keep it wide and short
            const height = isMobile 
                ? Math.max(600, containerWidth * 1.5)  // Mobile: at least 600px tall
                : Math.min(500, containerWidth * 0.5);  // Desktop: landscape
            
            const layout = {
                margin: { t: 10, l: 10, r: 10, b: 10 },
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                height: height,
                autosize: true,  // Let it auto-size to container
                hovermode: 'closest',  // Show hover for nearest item
                dragmode: false  // Disable drag to prevent zoom
            };
            
            const config = {
                responsive: true,
                displayModeBar: false,  // Hide toolbar on mobile
                displaylogo: false,
                scrollZoom: false,  // Disable scroll zoom
                doubleClick: false,  // Disable double-click zoom
                modeBarButtonsToRemove: ['zoom2d', 'pan2d', 'select2d', 'lasso2d', 'zoomIn2d', 'zoomOut2d', 'autoScale2d', 'resetScale2d']
            };
            
            Plotly.newPlot('heatmap', [trace], layout, config);
            
            // Mobile-friendly persistent tooltip
            const plotElement = document.getElementById('heatmap');
            let currentTooltip = null;
            
            // Detect mobile
            const isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            
            if (isMobileDevice) {
                // On mobile: tap to show persistent tooltip
                plotElement.on('plotly_click', function(data) {
                    if (data.points && data.points[0]) {
                        const point = data.points[0];
                        
                        // Remove old tooltip
                        if (currentTooltip) {
                            currentTooltip.remove();
                        }
                        
                        // Create persistent tooltip
                        const tooltip = document.createElement('div');
                        tooltip.style.cssText = `
                            position: fixed;
                            top: 50%;
                            left: 50%;
                            transform: translate(-50%, -50%);
                            background: rgba(0, 0, 0, 0.95);
                            color: white;
                            padding: 16px 20px;
                            border-radius: 8px;
                            font-size: 16px;
                            z-index: 10000;
                            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
                            border: 2px solid white;
                            text-align: center;
                            max-width: 80%;
                        `;
                        
                        const stockName = point.label.split('<br>')[0];
                        const change = point.text;
                        const marketCap = point.customdata.toFixed(1);
                        
                        tooltip.innerHTML = `
                            <div style="font-weight: bold; font-size: 18px; margin-bottom: 8px;">${stockName}</div>
                            <div style="margin-bottom: 4px;">Change: ${change}</div>
                            <div>Market Cap: $${marketCap}B</div>
                            <div style="margin-top: 12px; font-size: 12px; color: #999;">Tap anywhere to close</div>
                        `;
                        
                        document.body.appendChild(tooltip);
                        currentTooltip = tooltip;
                        
                        // Close on any tap
                        setTimeout(() => {
                            document.addEventListener('click', function closeTooltip() {
                                if (currentTooltip) {
                                    currentTooltip.remove();
                                    currentTooltip = null;
                                }
                                document.removeEventListener('click', closeTooltip);
                            }, { once: true });
                        }, 100);
                    }
                });
            } else {
                // On desktop: use default hover behavior (already works fine)
            }
            
            // Re-render on window resize
            window.addEventListener('resize', () => {
                const newWidth = document.getElementById('heatmap').offsetWidth;
                const newIsMobile = window.innerWidth <= 768;
                const newHeight = newIsMobile 
                    ? Math.max(600, newWidth * 1.5)
                    : Math.min(500, newWidth * 0.5);
                
                Plotly.relayout('heatmap', {
                    height: newHeight
                });
            });
        }
        
        // Load TWSE data on page load
        loadHeatmapData('twse');
    </script>
</body>
</html>
